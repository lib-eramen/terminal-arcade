[package]
name = "terminal-arcade"
version = "0.0.1"
authors = ["Ramen Developer <ramendev2009@gmail.com>"]
edition = "2021"
description = "Terminal-based arcade-style games for when you're bored out of your mind."
readme = "README.md"
repository = "https://github.com/developer-ramen/terminal-arcade"
license = "MIT"
keywords = ["arcade", "terminal", "games"]
categories = ["games"]
build = "build.rs"

[dependencies]
anyhow = "1.0.90"
better-panic = "0.3.0"
color-eyre = "0.6.3"
config = "0.13.4"
crossterm = { version = "0.27.0", features = ["event-stream"] }
derive-new = "0.6.0"
derive_builder = "0.20.2"
derive_more = { version = "1.0.0", features = ["deref", "deref_mut"] }
directories = "5.0.1"
futures = "0.3.31"
human-panic = "2.0.2"
lazy_static = "1.5.0"
libc = "0.2.161"
ratatui = { version = "0.27.0", features = [
    "all-widgets",
    "macros",
    "unstable",
    "crossterm",
    "palette",
] }
ratatui-macros = "0.4.4"
serde = { version = "1.0.210", features = ["derive", "rc"] }
signal-hook = "0.3.17"
strip-ansi-escapes = "0.2.0"
thiserror = "1.0.64"
time = { version = "0.3.36", features = [
    "formatting",
    "parsing",
    "local-offset",
    "serde",
] }
tokio = { version = "1.40.0", features = ["full", "tracing"] }
tokio-util = { version = "0.7.12", features = ["full", "tracing"] }
toml = "0.8.19"
tracing = { version = "0.1.40", features = ["async-await", "log"] }
tracing-error = "0.2.0"
tracing-subscriber = { version = "0.3.18", features = [
    "ansi",
    "env-filter",
    "fmt",
    "local-time",
    "time",
] }
unicode-segmentation = "1.12.0"

[build-dependencies]
vergen-gix = { version = "1.0.2", features = ["build", "cargo", "rustc", "si"] }
directories = "5.0.1"

[dev-dependencies]
cargo-make = "0.37.22"
rstest = "0.23.0"
